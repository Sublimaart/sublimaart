/* SublimaArt — conexão com o Firebase (banco de dados gratuito do Google) e login da equipe. */

const CONFIG_FIREBASE_EMBUTIDA = null;
const FB = { config: null, app: null, fs: null, db: null, authMod: null, auth: null, modo: '' };
function fbUrl(nome) { return 'https://www.gstatic.com/firebasejs/' + FB_VERSAO + '/firebase-' + nome + '.js'; }

async function lerConfigFirebase() {
  if (configFirebaseValida(CONFIG_FIREBASE_EMBUTIDA)) return { config: CONFIG_FIREBASE_EMBUTIDA, origem: 'site' };
  try {
    const r = await fetch('firebase-config.json?v=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      if (configFirebaseValida(j)) return { config: j, origem: 'site' };
    }
  } catch (e) { /* arquivo ainda não enviado */ }
  try {
    const salvo = JSON.parse(localStorage.getItem(CHAVE_FIREBASE) || 'null');
    if (configFirebaseValida(salvo)) return { config: salvo, origem: 'aparelho' };
  } catch (e) { /* sem armazenamento */ }
  return null;
}
async function iniciarFirebase(config, completo) {
  if (FB.app && (FB.modo === 'completo' || !completo)) return true;
  const appMod = await import(fbUrl('app'));
  const fsMod = await import(fbUrl(completo ? 'firestore' : 'firestore-lite'));
  /* Duas chamadas ao mesmo tempo (site e painel): nunca volta do modo completo para o leve. */
  if (FB.modo === 'completo' || (FB.modo === 'lite' && !completo)) return true;
  let app;
  try { app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(config); }
  catch (e) { app = appMod.getApp(); }
  FB.config = config;
  FB.app = app;
  FB.fs = fsMod;
  FB.db = fsMod.getFirestore(app);
  FB.modo = completo ? 'completo' : 'lite';
  return true;
}
async function iniciarAuth() {
  if (FB.auth) return FB.auth;
  FB.authMod = await import(fbUrl('auth'));
  FB.auth = FB.authMod.getAuth(FB.app);
  return FB.auth;
}

/* Leitura e escrita simples (site público) */
async function lerDoc(path) {
  const s = await FB.fs.getDoc(FB.fs.doc(FB.db, path));
  return s.exists() ? s.data() : null;
}
async function lerColecao(path) {
  const qs = await FB.fs.getDocs(FB.fs.collection(FB.db, path));
  return qs.docs.map(d => d.data());
}
async function criarDocs(lista) {
  if (lista.length === 1) { await FB.fs.setDoc(FB.fs.doc(FB.db, lista[0][0]), lista[0][1]); return; }
  const b = FB.fs.writeBatch(FB.db);
  for (const [path, dados] of lista) b.set(FB.fs.doc(FB.db, path), dados);
  await b.commit();
}
function codigoErro(e) { return String((e && e.code) || '').replace(/^(firestore|auth)\//, ''); }

/* Adaptador com a mesma forma usada pelo painel: doc().set/update/delete/onSnapshot e collection().onSnapshot */
function adaptadorDb() {
  const f = FB.fs, db = FB.db;
  const snapDoc = s => ({ id: s.id, exists: s.exists(), data: () => s.data() });
  return {
    doc: path => ({
      get: async () => snapDoc(await f.getDoc(f.doc(db, path))),
      set: dados => f.setDoc(f.doc(db, path), dados),
      update: dados => f.updateDoc(f.doc(db, path), dados),
      delete: () => f.deleteDoc(f.doc(db, path)),
      onSnapshot: (next, err) => f.onSnapshot(f.doc(db, path), s => next(snapDoc(s)), err),
    }),
    collection: path => ({
      onSnapshot: (next, err) => f.onSnapshot(f.collection(db, path), qs => next({ docs: qs.docs.map(snapDoc) }), err),
    }),
    lote: async ops => {
      for (let i = 0; i < ops.length; i += 400) {
        const b = f.writeBatch(db);
        for (const o of ops.slice(i, i + 400)) {
          const r = f.doc(db, o.path);
          if (o.op === 'delete') b.delete(r);
          else if (o.op === 'update') b.update(r, o.dados);
          else b.set(r, o.dados);
        }
        await b.commit();
      }
    },
  };
}

      '<ol class="lista-passos pequeno"><li>No repositório, toque em <strong>Add file</strong> → <strong>Create new file</strong>.</li><li>Nome do arquivo: <code>firebase-config.json</code></li><li>Cole o conteúdo e toque em <strong>Commit changes</strong>. Em 1 a 2 minutos o site passa a usar o banco.</li></ol>' +
      '<p class="pequeno sutil">Essas chaves são públicas por natureza (todo site com Firebase mostra isso). Quem protege os dados são as regras do passo 5.</p>'
      : '<p class="sutil pequeno">Faça o passo 4 primeiro.</p>'), atual && atual.origem === 'site');

  const p7 = passoInst(7, 'Testar',
    '<div class="linha-flex"><button type="button" class="botao" data-acao="testarInst"' + (t && t.rodando ? ' disabled' : '') + '>' + (t && t.rodando ? 'Testando…' : 'Testar agora') + '</button></div>' +
    (t ? '<ul class="lista-limpa lista-teste">' +
      linhaTeste(t.arquivo, t.arquivoTxt || 'Arquivo firebase-config.json no site') +
      linhaTeste(t.banco, t.bancoTxt || 'Banco de dados e regras') +
      '</ul>' : '') +
    (t && t.banco === true ? '<p class="aviso ok">Banco ligado! Agora abra o painel, entre com o e-mail e a senha do passo 3 e, em Configurações, cadastre o Pix e o WhatsApp da loja.</p><div class="linha-flex"><a class="botao" href="#painel">Abrir o painel</a></div>' : ''),
    t && t.banco === true && t.arquivo === true);

  return cabeca + '<div class="envolve secao pilha estreito">' + estado + p0 + p1 + p2 + p3 + p4 + p5 + p6 + p7 +
    '<p class="pequeno sutil">Limites do plano gratuito do Firebase: cerca de 50 mil leituras e 20 mil gravações por dia, e 1 GB de dados. Sobra para começar; o painel avisa se algum limite for atingido.</p></div>';
}
ACOES.lerConfigInst = () => {
  const i = S.ui.inst;
  const c = lerConfigColada(i.colado);
  if (!c) { i.config = null; i.erroColado = 'Não encontrei apiKey, projectId e appId no texto. Copie o bloco inteiro do firebaseConfig.'; render(); focarErro(); return; }
  i.config = c;
  i.erroColado = '';
  render();
  rolarPara('passo-5');
};
ACOES.maisEmailInst = () => { const i = S.ui.inst; if (i.emails.length < 6) i.emails.push(''); render(); };
ACOES.gerarRegrasInst = () => {
  const i = S.ui.inst;
  const emails = [...new Set(i.emails.map(e => String(e || '').trim().toLowerCase()).filter(emailValido))];
  if (!emails.length) { toast('Escreva pelo menos o seu e-mail.'); return; }
  i.regras = regrasFirestore(emails);
  render();
};
ACOES.usarNesteAparelho = () => {
  const i = S.ui.inst;
  const c = i.config || (i.atual && i.atual.config);
  if (!c) return;
  try { localStorage.setItem(CHAVE_FIREBASE, JSON.stringify(c)); toast('Pronto: este aparelho já usa o banco. Os clientes passam a usar depois do arquivo no GitHub.'); }
  catch (e) { toast('Este navegador não deixou guardar. Siga com o arquivo no GitHub.'); }
};
function comPrazo(promessa, ms) {
  return Promise.race([promessa, new Promise((_, rej) => setTimeout(() => rej({ code: 'deadline-exceeded' }), ms))]);
}
async function testarBanco(config) {
  const appMod = await import(fbUrl('app'));
  const lite = await import(fbUrl('firestore-lite'));
  const app = appMod.initializeApp(config, 'teste' + Date.now());
  try {
    const db = lite.getFirestore(app);
    await comPrazo(lite.getDoc(lite.doc(db, 'config/loja')), 15000);
    return '';
  } catch (e) {
    return codigoErro(e) || 'erro';
  } finally {
    try { await appMod.deleteApp(app); } catch (e) { /* nada */ }
  }
}
ACOES.testarInst = async () => {
  const i = S.ui.inst;
  const t = { rodando: true, arquivo: null, banco: null };
  i.teste = t;
  render();
  let doSite = null;
  try {
    const r = await fetch('firebase-config.json?v=' + Date.now(), { cache: 'no-store' });
    if (r.ok) { const j = await r.json(); if (configFirebaseValida(j)) doSite = j; }
  } catch (e) { /* sem arquivo */ }
  const colado = i.config;
  if (doSite && (!colado || colado.projectId === doSite.projectId)) { t.arquivo = true; t.arquivoTxt = 'firebase-config.json encontrado no site (projeto ' + esc(doSite.projectId) + ').'; }
  else if (doSite) { t.arquivo = false; t.arquivoTxt = 'O firebase-config.json do site é do projeto ' + esc(doSite.projectId) + ', diferente do colado no passo 4. Corrija o arquivo no GitHub.'; }
  else { t.arquivo = false; t.arquivoTxt = 'Ainda não encontrei o firebase-config.json no site. Depois de salvar no GitHub, espere 1 a 2 minutos e teste de novo.'; }
  const config = colado || doSite || (i.atual && i.atual.config);
  if (!config) { t.banco = false; t.bancoTxt = 'Falta a configuração do passo 4.'; }
  else {
    let erro;
    try { erro = await testarBanco(config); } catch (e) { erro = 'rede'; }
    if (!erro) { t.banco = true; t.bancoTxt = 'O banco respondeu e as regras estão publicadas.'; }
    else if (erro === 'permission-denied') { t.banco = false; t.bancoTxt = 'O banco respondeu, mas as regras do passo 5 ainda não foram publicadas.'; }
    else if (erro === 'not-found' || erro === 'failed-precondition') { t.banco = false; t.bancoTxt = 'O banco de dados ainda não foi criado neste projeto (passo 2).'; }
    else if (/api-key|invalid-argument/.test(erro)) { t.banco = false; t.bancoTxt = 'A configuração parece errada. Copie de novo o firebaseConfig (passo 4).'; }
    else { t.banco = false; t.bancoTxt = 'Não deu para falar com o banco (' + esc(erro) + '). Confira a internet e tente de novo.'; }
  }
  t.rodando = false;
  render();
};

/* SublimaArt — rotas e inicialização do site. */

const CHAVE_LOJA = 'sublimaart:loja';
function lerEstadoPublico() {
  let loja = null;
  try {
    const el = document.getElementById('estado-publico');
    const j = el ? JSON.parse(el.textContent) : null;
    if (j && ehObj(j.loja)) loja = j.loja;
  } catch (e) { /* estado ausente ou inválido */ }
  try {
    const c = JSON.parse(localStorage.getItem(CHAVE_LOJA) || 'null');
    if (ehObj(c)) loja = c;
  } catch (e) { /* sem armazenamento */ }
  return { loja: lojaPublica(loja || PADRAO) };
}
function aplicarLoja(cfg) {
  PUB.loja = lojaPublica(cfg);
  try { localStorage.setItem(CHAVE_LOJA, JSON.stringify(PUB.loja)); } catch (e) { /* sem armazenamento */ }
}
function injetarDefs() {
  if (document.getElementById('sa-defs')) return;
  const box = document.createElement('div');
  box.innerHTML = '<svg id="sa-defs" class="defs-svg" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><symbol id="sa-marca" viewBox="0 0 120 69"><image href="' + LOGO.marcaMini + '" width="120" height="69"/></symbol></svg>';
  document.body.appendChild(box.firstChild);
}

/* ---------- Rotas ---------- */
function lerRota() {
  let h = '';
  try { h = decodeURIComponent(String(location.hash || '').replace(/^#\/?/, '')).trim(); } catch (e) { h = ''; }
  const m = /^([gtp])-([A-Za-z0-9]{3,12})$/.exec(h);
  if (m) return { nome: { g: 'grupo', t: 'torcida', p: 'patrocinio' }[m[1]], codigo: limparCodigo(m[2]) };
  if (['criar', 'patrocinar', 'painel', 'instalar'].includes(h)) return { nome: h, codigo: null };
  return { nome: 'inicio', codigo: null };
}
function topo() {
  if (S.rota.nome === 'painel') return topoPainel();
  if (S.rota.nome === 'instalar') return topoInstalar();
  return topoSite();
}
function rodape() { return S.rota.nome === 'painel' || S.rota.nome === 'instalar' ? rodapePainel() : rodapeSite(); }
function vista() {
  const r = S.rota;
  const nome = PUB.loja.nome || 'SublimaArt';
  let titulo = nome + ' · Uniformes para grupos';
  let html;
  switch (r.nome) {
    case 'grupo': html = vGrupo(r.codigo); titulo = tituloPedido(r.codigo, '') + nome; break;
    case 'torcida': html = vTorcida(r.codigo); titulo = tituloPedido(r.codigo, 'Torcida · ') + nome; break;
    case 'patrocinio': html = vPatrocinio(r.codigo); titulo = tituloPedido(r.codigo, 'Patrocínio · ') + nome; break;
    case 'criar': html = vCriar(); titulo = 'Criar pedido · ' + nome; break;
    case 'patrocinar': html = vPatrocinar(); titulo = 'Patrocinar times · ' + nome; break;
    case 'painel': html = vPainel(); titulo = 'Painel · ' + nome; break;
    case 'instalar': html = vInstalar(); titulo = 'Instalação · ' + nome; break;
    default: html = vInicio();
  }
  try { if (document.title !== titulo) document.title = titulo; } catch (e) { /* nada */ }
  return html;
}
function tituloPedido(codigo, prefixo) {
  const g = grupoPublicoPorCodigo(codigo);
  return prefixo + (g ? g.nome : 'Pedido ' + codigo) + ' · ';
}
function aoMudarHash() {
  aoMudarRota();
  if (S.rota.nome === 'painel') iniciarPainel();
}

/* ---------- Conexão do site público ---------- */
async function conectar() {
  if (S.rota.nome === 'painel') { await iniciarPainel(); lerLojaPublica(); return; }
  const cfg = await lerConfigFirebase();
  if (!cfg) { S.online = false; S.conectando = false; render(); return; }
  try {
    await iniciarFirebase(cfg.config, false);
  } catch (e) {
    S.online = false;
    S.conectando = false;
    S.falhaConexao = true;
    render();
    return;
  }
  await lerLojaPublica();
  S.online = true;
  S.conectando = false;
  render();
}
async function lerLojaPublica() {
  if (!FB.db) return;
  try { const c = await lerDoc('config/loja'); if (c) { aplicarLoja(c); agendarRender(); } } catch (e) { /* segue com o padrão */ }
}

function iniciar() {
  PUB = lerEstadoPublico();
  S.local = lerLocal();
  S.rota = lerRota();
  injetarDefs();
  document.addEventListener('click', aoClicar);
  document.addEventListener('input', aoDigitar);
  document.addEventListener('change', aoMudar);
  document.addEventListener('submit', aoEnviar);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.ui.folha) ACOES.fecharFolha(); });
  document.addEventListener('compositionstart', () => { compondo = true; });
  document.addEventListener('compositionend', () => {
    compondo = false;
    if (renderPendente) { renderPendente = false; agendarRender(); }
  });
  window.addEventListener('hashchange', aoMudarHash);
  render();
  conectar();
}
